[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Ship `sirbone-update` (axoupdater) next to the binary, so shell/powershell
# installs can self-upgrade without re-running the installer. `sirbone update`
# forwards to it (see `run_update` in src/cmd/update.rs). Homebrew/npm are not
# enabled: both need a second repository/registry to publish into.
install-updater = true
# cargo-dist resolves this path from .github/workflows/.
github-build-setup = "../dist/build-setup.yml"
# release.yml carries a hand-applied idempotency patch (re-cutting an existing
# tag must update the release, not fail on `gh release create`); this tells
# dist's plan step to skip the generated-CI-up-to-date check for release.yml
# instead of rejecting the edit. Value is a list of generate tasks: "ci" =
# don't check/regenerate the GitHub Actions workflows.
allow-dirty = ["ci"]
