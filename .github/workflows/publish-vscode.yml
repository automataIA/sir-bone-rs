name: Publish VS Code Extension

# Fires on the same version tags as the binary release workflow, so a single
# `git tag vX.Y.Z && git push --tags` publishes both the binaries (release.yml)
# and the VS Code extension. The version actually published is the one in
# editors/vscode/package.json — bump it in lockstep before tagging.
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci
      - run: npm run compile

      # Build the .vsix once, then reuse it for both registries.
      - name: Package .vsix
        run: npx --yes @vscode/vsce package -o sirbone-vscode.vsix

      # Optional too: only runs if the OPEN_VSX_TOKEN secret is set, mirroring
      # the Marketplace step below (tag pushes must not fail just because no
      # publish credentials are configured on the repo).
      - name: Publish to Open VSX
        if: ${{ env.OPEN_VSX_TOKEN != '' }}
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ env.OPEN_VSX_TOKEN }}
          extensionFile: editors/vscode/sirbone-vscode.vsix
          skipDuplicate: true

      # Optional: only runs if the VS_MARKETPLACE_TOKEN secret is set.
      # (Azure DevOps PAT — see the PAT retirement note in pub-extensions.md.)
      - name: Publish to VS Marketplace
        if: ${{ env.VS_MARKETPLACE_TOKEN != '' }}
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ env.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: editors/vscode/sirbone-vscode.vsix
          skipDuplicate: true

      # Also attach the .vsix to the GitHub Release that cargo-dist creates for
      # this tag, so it can be installed manually too. Plain gh instead of
      # softprops/action-gh-release: on a pre-existing release its update call
      # 403s ("Resource not accessible by integration"), while `gh release
      # upload --clobber` to the same release is proven to work with
      # GITHUB_TOKEN (release.yml's dist upload does exactly that).
      - name: Attach .vsix to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # First cut of the tag: the cargo-dist release may not exist yet (the
          # two workflows run in parallel); create a stub for it to fill later.
          gh release view "$GITHUB_REF_NAME" --json id --jq .id >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" --clobber editors/vscode/sirbone-vscode.vsix
